# Verification de chaque envoi sur main et de chaque pull request : types, lint, tests
# automatises (base PostgreSQL jetable, jamais la base de production), build de production.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ges_mali_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base jetable du service ci-dessus (scripts/tests.mjs refuse toute base non locale)
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ges_mali_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ges_mali_test?sslmode=disable
      AUTH_SECRET: secret-de-ci-sans-usage-en-production
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (migrations, isolation entre ecoles, comptes, e-mails...)
        run: npm test

      - name: Build de production
        run: npm run build
